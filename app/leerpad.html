<title>Leerpad Ethisch Hacken</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one centred column (max 720px): stat bar, sticky tab bar, one panel per tab; lessons and reviews open as bottom sheets */
:root{
  --bg:#ECEFF4; --surface:#FFFFFF; --surface-2:#F4F6F9; --ink:#141A29; --muted:#566073; --line:#D5DAE3;
  --accent:#2846C7; --accent-deep:#1A2F8F; --accent-ink:#FFFFFF; --accent-soft:#E2E7FB;
  --amber:#B86E05; --amber-soft:#FBEFD9;
  --ok:#0B7F5F; --ok-deep:#075A43; --ok-soft:#DAF1E8; --bad:#BC2F2F; --bad-soft:#F9E1E1;
  --later:#C3C9D5; --scrim:rgba(12,16,26,.5);
  --heat1:#D5DCF8; --heat2:#9DAEEE; --heat3:#5A73DD; --heat4:#2846C7;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E121B; --surface:#161B27; --surface-2:#1C2231; --ink:#E6E9F0; --muted:#97A0B2; --line:#2A3143;
    --accent:#8399FF; --accent-deep:#4F64C8; --accent-ink:#0B1130; --accent-soft:#222B4E;
    --amber:#F0A63A; --amber-soft:#3A2C14;
    --ok:#3FC79A; --ok-deep:#24876A; --ok-soft:#133328; --bad:#FF7A7A; --bad-soft:#3B1D1D;
    --later:#3A4255; --scrim:rgba(0,0,0,.6);
    --heat1:#222B4A; --heat2:#34458A; --heat3:#5A73D6; --heat4:#8399FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E121B; --surface:#161B27; --surface-2:#1C2231; --ink:#E6E9F0; --muted:#97A0B2; --line:#2A3143;
  --accent:#8399FF; --accent-deep:#4F64C8; --accent-ink:#0B1130; --accent-soft:#222B4E;
  --amber:#F0A63A; --amber-soft:#3A2C14;
  --ok:#3FC79A; --ok-deep:#24876A; --ok-soft:#133328; --bad:#FF7A7A; --bad-soft:#3B1D1D;
  --later:#3A4255; --scrim:rgba(0,0,0,.6);
  --heat1:#222B4A; --heat2:#34458A; --heat3:#5A73D6; --heat4:#8399FF;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 72px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:grid;gap:16px}
.stack-s{display:grid;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.section-title{font-size:18px;margin-bottom:10px}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding-block:8px 12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-size:21px;letter-spacing:.01em}
.mark{width:34px;height:34px;flex:none;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;font-size:14px}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg{width:16px;height:16px;flex:none}
.chip.streak svg{color:var(--amber)}
.chip.xp svg{color:var(--accent)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:12px 12px 9px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* today */
.today-head{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:92px;height:92px;flex:none}
.ring text{font-family:var(--f-display);font-weight:700;fill:var(--ink)}
.ring .sub{font-family:var(--f-mono);font-weight:400;fill:var(--muted)}
.today-head h2{font-size:22px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pill:hover{border-color:var(--accent)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.plan{display:grid;gap:8px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.item.done{background:var(--surface-2)}
.item.done .item-text{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--later)}
.item.quiz{border-color:var(--accent);background:var(--accent-soft)}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--later);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;padding:0;margin-top:1px;color:transparent}
.check:hover{border-color:var(--ok)}
.check[aria-checked="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.check svg{width:16px;height:16px}
.qicon{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.item-text{font-weight:500}
.item-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:6px;font-size:13px;color:var(--muted)}
.mins{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.open{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:7px;border:1px solid var(--line);text-decoration:none;color:var(--accent);font-size:13px;font-weight:600;white-space:nowrap;background:var(--surface)}
.open:hover{border-color:var(--accent)}
.open svg{width:13px;height:13px}
.textbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-decoration-color:var(--later);text-underline-offset:2px;cursor:pointer;font-size:13px;text-align:left}
.textbtn:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;border:0;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 var(--accent-deep)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-deep)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.danger{background:var(--bad);color:var(--surface);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.review-card{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--amber-soft);border-color:transparent}
.review-card > div{min-width:0;flex:1 1 240px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;margin-top:12px}
.day{display:grid;gap:4px;justify-items:center;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.dot svg{width:14px;height:14px}
.dot.on{background:var(--amber);border-color:var(--amber);color:var(--surface)}
.dot.today{outline:2px solid var(--ink);outline-offset:2px}
.callout{padding:12px 14px;border-radius:var(--r);background:var(--ok-soft);font-size:14px}

/* path */
.unit{margin-bottom:26px}
.unit-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r);background:var(--ink);color:var(--bg)}
.unit-head > div{min-width:0}
.unit-head .eyebrow{color:inherit;opacity:.7}
.unit-head h3{font-size:19px;margin-top:2px}
.unit-head p{margin-top:4px;font-size:14px;opacity:.82}
.meter{font-family:var(--f-mono);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;padding:2px 8px;border-radius:6px;border:1px solid currentColor;opacity:.85}
.path{--zig:52px;display:grid;justify-items:center;gap:16px;padding-block:22px 4px}
@media (max-width:440px){.path{--zig:32px}}
.node-row{display:grid;justify-items:center;gap:6px;transform:translateX(calc(var(--k,0) * var(--zig)));width:156px}
.node{position:relative;width:62px;height:62px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:19px;background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 2px var(--later),0 4px 0 var(--later);transition:transform .08s}
.node:active{transform:translateY(3px)}
.node.done{background:var(--ok);color:var(--surface);box-shadow:0 4px 0 var(--ok-deep)}
.node.done svg{width:26px;height:26px}
.node.started{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent),0 4px 0 var(--accent-deep)}
.node.current{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-deep),0 0 0 7px var(--accent-soft)}
.node .star{position:absolute;right:-5px;top:-5px;width:22px;height:22px;border-radius:50%;background:var(--amber);color:var(--surface);display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.node .star svg{width:12px;height:12px}
.node-label{font-size:13px;line-height:1.3;text-align:center;max-width:156px}
.node-label small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:11px;margin-top:2px}
.start-tag{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.08em;background:var(--accent);color:var(--accent-ink);padding:3px 8px;border-radius:6px}

/* tools */
.tool-list{display:grid;gap:8px}
.tool{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tool h4{font-family:var(--f-body);font-size:15px;font-weight:600}
.tag{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
pre.cmd{margin:0;padding:12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--f-mono);font-size:12.5px;overflow-x:auto;white-space:pre}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tile .num{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .lbl{font-size:13px;color:var(--muted);margin-top:2px}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar > span{display:block;height:100%;background:var(--accent);border-radius:99px}
.units-prog{display:grid;gap:10px}
.uprog{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;font-size:14px}
.uprog .bar{grid-column:1 / -1;height:8px}
.uprog .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.heat-wrap{overflow-x:auto}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);grid-auto-columns:14px;gap:3px;width:max-content}
.heat i{border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.heat i.l1{background:var(--heat1);border-color:var(--heat1)}
.heat i.l2{background:var(--heat2);border-color:var(--heat2)}
.heat i.l3{background:var(--heat3);border-color:var(--heat3)}
.heat i.l4{background:var(--heat4);border-color:var(--heat4)}
.heat i.future{visibility:hidden}
.legend{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{padding:12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);display:grid;gap:2px}
.badge b{font-family:var(--f-display);font-size:15px}
.badge span{font-size:12px;color:var(--muted)}
.badge.on{border-color:var(--amber);background:var(--amber-soft)}
.badge:not(.on){opacity:.6}
textarea, input[type="text"]{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}

/* sheet */
.backdrop{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding-top:18px;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;gap:18px;align-content:start}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-head > div{min-width:0}
.sheet-head h2{font-size:24px;margin-top:2px}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none}
.x svg{width:16px;height:16px}
.intro{font-size:15px;max-width:62ch}
.q{display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:var(--r)}
.q > p{font-weight:600}
.opt{text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);border-bottom-width:3px;background:var(--surface);cursor:pointer;font-size:14px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{font-size:14px;padding:10px 12px;border-radius:10px}
.fb.good{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.progressline{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progressline span{display:block;height:100%;background:var(--ok);transition:width .3s}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;z-index:40;max-width:calc(100% - 32px);box-shadow:0 6px 24px var(--scrim)}
.footer{margin-top:28px;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>

  var seen = LESSONS.filter(function(l){ return stepsDone(l) > 0 || l.quiz.some(function(q, i){ return S.quiz[stepId(l,i)] != null; }); });
  var pool = [];
  (seen.length ? seen : UNITS[0].lessons).forEach(function(l){ l.quiz.forEach(function(q, i){ pool.push({l:l, qi:i, w:S.quiz[stepId(l,i)] === 0 ? 0 : 1}); }); });
  shuffle(pool); pool.sort(function(a, b){ return a.w - b.w; });
  review = {qs:pool.slice(0, 5), idx:0, picked:null, right:0, xp:0};
  openId = null; renderReview();
}
function renderReview(){
  var root = document.getElementById("sheet-root");
  var r = review, body;
  if (r.idx >= r.qs.length){
    body = [el("p", {class:"eyebrow", text:"Herhaling klaar"}),
      el("h2", {style:"font-size:26px", text:r.right + " van " + r.qs.length + " goed"}),
      el("p", {text:"+" + r.xp + " XP en 8 minuten geoefend. Vragen die je fout had komen de volgende keer eerder terug."}),
      el("div", {}, el("button", {class:"btn", text:"Klaar", onclick:closeSheet}))];
  } else {
    var cur = r.qs[r.idx];
    body = [el("div", {class:"sheet-head"},
        el("div", {style:"flex:1"}, el("p", {class:"eyebrow", text:"Herhaling · vraag " + (r.idx+1) + " van " + r.qs.length}),
          el("div", {class:"progressline", style:"margin-top:8px"}, el("span", {style:"width:" + Math.round(r.idx / r.qs.length * 100) + "%"}))),
        el("button", {class:"x", "aria-label":"Stoppen", icon:I.x, onclick:closeSheet})),
      el("p", {class:"small muted", text:"Uit les " + cur.l.n + ": " + cur.l.title}),
      questionBlock(cur.l, cur.qi, function(opt){ pickReview(opt); }, true, r.picked)];
    if (r.picked != null) body.push(el("div", {}, el("button", {class:"btn", text: r.idx + 1 < r.qs.length ? "Volgende vraag" : "Afronden", onclick:nextReview})));
  }
  var sheet = el("div", {class:"sheet", role:"dialog", "aria-modal":"true", "aria-label":"Herhaling"}, body);
  var back = el("div", {class:"backdrop"}, sheet);
  root.innerHTML = ""; root.append(back);
  document.body.style.overflow = "hidden";
}
function pickReview(opt){
  var r = review, cur = r.qs[r.idx], id = stepId(cur.l, cur.qi);
  r.picked = opt;
  if (opt === cur.l.quiz[cur.qi].a){ r.right++; r.xp += 3; if (S.quiz[id] === 0) S.quiz[id] = 2; }
  renderReview();
}
function nextReview(){
  var r = review;
  r.idx++; r.picked = null;
  if (r.idx >= r.qs.length){ S.reviewXp += r.xp; S.reviews++; addLog(todayKey(), 8); persist(); render(); }
  renderReview();
}

/* ---------- Render all ---------- */
function render(){
  renderStats(); renderToday(); renderPath(); renderTools(); renderProgress(); renderSettings(); renderStorageNote();
  if (openId && !review) renderSheet();
}

document.querySelectorAll(".tab").forEach(function(t){ t.addEventListener("click", function(){ setTab(t.dataset.tab); }); });
document.addEventListener("keydown", function(e){ if (e.key === "Escape" && (openId || review)) closeSheet(); });
S = loadLocal() || freshState();
render();
try { var savedTab = localStorage.getItem(LS_KEY + ":tab"); if (savedTab && document.querySelector('[data-tab="' + savedTab + '"]')) setTab(savedTab); } catch(e){}
connectStore();
</script>
